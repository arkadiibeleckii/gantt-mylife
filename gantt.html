<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диаграмма Ганта 2026 — Холдинг «Моя жизнь»</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f5f5f2; padding: 24px; color: #1a1a1a; }
.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; flex-wrap: wrap; gap: 8px; }
h1 { font-size: 18px; font-weight: 600; }
.btn-group { display: flex; gap: 8px; }
.btn { font-size: 12px; color: #666; background: none; border: 1px solid #ddd; border-radius: 5px; padding: 5px 12px; cursor: pointer; }
.btn:hover { color: #222; border-color: #aaa; }
.btn-export { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.btn-export:hover { background: #333; }
.subtitle { font-size: 13px; color: #999; margin-bottom: 20px; }
.wrap { overflow-x: auto; }
.chart { min-width: 960px; background: #fff; border-radius: 10px; border: 1px solid #e5e5e0; padding: 20px 24px 24px; }
.header-row { display: flex; margin-bottom: 2px; }
.name-col { width: 172px; flex-shrink: 0; }
.months { display: flex; flex: 1; }
.month-label { flex: 1; text-align: left; font-size: 11px; color: #444; font-weight: 600; border-left: 1px solid #ddd; padding: 4px 0 2px 4px; }
.dates-row { display: flex; margin-bottom: 10px; }
.dates-col { width: 172px; flex-shrink: 0; }
.dates-tl { flex: 1; position: relative; height: 14px; }
.date-tick { position: absolute; font-size: 10px; color: #ccc; transform: translateX(-50%); user-select: none; }
.section-label { font-size: 11px; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: 0.07em; padding: 12px 0 5px; border-bottom: 1px solid #f0f0ec; margin-bottom: 3px; display: flex; align-items: center; cursor: default; }
.sec-drag-handle { cursor: grab; color: #ddd; font-size: 14px; margin-right: 6px; user-select: none; flex-shrink: 0; line-height: 1; }
.sec-drag-handle:hover { color: #aaa; }
.sec-drag-handle:active { cursor: grabbing; }
.section-block { transition: opacity 0.15s; }
.section-block.dragging-sec { opacity: 0.5; }
.section-block.drag-over-sec { border-top: 2px solid #534AB7; }
.section-label .name-col { color: #bbb; }
.row { display: flex; align-items: center; margin-bottom: 2px; min-height: 30px; border-radius: 4px; }
.row:hover { background: #fafaf8; }
.task-name { width: 172px; flex-shrink: 0; font-size: 12px; color: #333; padding-right: 8px; line-height: 1.3; display: flex; align-items: flex-start; gap: 3px; }
.task-name-text { flex: 1; min-width: 0; }
.task-name .sub { font-size: 11px; color: #bbb; display: block; margin-top: 1px; }
.tl { flex: 1; position: relative; height: 30px; }
.grid-lines { position: absolute; inset: 0; display: flex; pointer-events: none; }
.grid-line { flex: 1; border-left: 1px solid #f2f2ee; }
.bar-wrap { position: absolute; height: 20px; top: 5px; z-index: 2; }
.bar-body { position: absolute; inset: 0; border-radius: 5px; cursor: grab; user-select: none; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.85); overflow: hidden; white-space: nowrap; }
.bar-body:active { cursor: grabbing; }
.handle { position: absolute; top: 0; width: 7px; height: 100%; cursor: ew-resize; z-index: 3; display: flex; align-items: center; justify-content: center; }
.handle::after { content:''; width:2px; height:9px; background:rgba(255,255,255,0.45); border-radius:1px; }
.handle-left { left:0; border-radius:5px 0 0 5px; }
.handle-right { right:0; border-radius:0 5px 5px 0; }
.handle:hover::after { background:rgba(255,255,255,0.9); }
.bar-wrap.dragging .bar-body { box-shadow:0 4px 14px rgba(0,0,0,0.22); opacity:.9; }
.deadline { position:absolute; top:1px; width:2px; height:27px; border-radius:1px; background:#E24B4A; cursor:ew-resize; z-index:4; }
.deadline::after { content:''; position:absolute; top:-3px; left:-3px; width:8px; height:8px; background:#E24B4A; border-radius:50%; }
.deadline:hover { width:4px; margin-left:-1px; }
.deadline.dragging { width:4px; margin-left:-1px; opacity:.8; }
/* + button: sits in the name column of the last row, right after the delete X */
.add-btn-inline { width:16px; height:16px; border-radius:50%; border:1.5px dashed #ccc; background:none; cursor:pointer; font-size:12px; color:#ccc; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; line-height:1; padding:0; }
.add-btn-inline:hover { border-color:#888; color:#888; }
.add-form { display:none; flex-direction:column; gap:6px; padding:10px 12px; background:#f9f9f7; border-radius:8px; border:1px solid #e5e5e0; margin:2px 0 4px; }
.add-form.open { display:flex; }
.add-form input { font-size:12px; border:1px solid #ddd; border-radius:5px; padding:5px 8px; outline:none; background:#fff; }
.add-form input:focus { border-color:#888; }
.add-form-btns { display:flex; gap:6px; }
.add-form-btns button { font-size:12px; padding:4px 10px; border-radius:5px; cursor:pointer; border:1px solid #ddd; background:#fff; }
.add-form-btns .btn-ok { background:#1a1a1a; color:#fff; border-color:#1a1a1a; }
.delete-btn { font-size:10px; color:#ddd; background:none; border:none; cursor:pointer; padding:2px 0 0; flex-shrink:0; line-height:1; }
.delete-btn:hover { color:#E24B4A; }
.legend { display:flex; flex-wrap:wrap; gap:14px; margin-top:18px; padding-top:14px; border-top:1px solid #f0f0ec; }
.legend-item { display:flex; align-items:center; gap:6px; font-size:12px; color:#777; }
.legend-dot { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
.hint { font-size:11px; color:#ccc; margin-top:10px; text-align:right; }
.tooltip { position:fixed; background:#1a1a1a; color:#fff; font-size:11px; padding:5px 10px; border-radius:5px; pointer-events:none; z-index:100; display:none; white-space:nowrap; }
</style>
</head>
<body>

<div class="top-bar">
  <h1>Диаграмма Ганта — Холдинг «Моя жизнь» 2026</h1>
  <div class="btn-group">
    <button class="btn" onclick="resetAll()">↺ Сбросить</button>
    <button class="btn btn-export" onclick="exportChart()">↓ Экспорт для команды</button>
  </div>
</div>
<p class="subtitle">Январь — Декабрь 2026 · Тяни полосы и дедлайны · + добавляй задачи</p>

<div class="wrap">
<div class="chart">
<div class="header-row"><div class="name-col"></div><div class="months" id="mh"></div></div>
<div class="dates-row"><div class="dates-col"></div><div class="dates-tl" id="dtl"></div></div>
<div id="cb"></div>
<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#534AB7"></div>Костя</div>
  <div class="legend-item"><div class="legend-dot" style="background:#0F6E56"></div>Денис</div>
  <div class="legend-item"><div class="legend-dot" style="background:#185FA5"></div>Миша</div>
  <div class="legend-item"><div class="legend-dot" style="background:#993C1D"></div>Аркадий</div>
  <div class="legend-item"><div class="legend-dot" style="background:#BA7517"></div>Запуск / событие</div>
  <div class="legend-item"><div class="legend-dot" style="background:#E24B4A;border-radius:50%"></div>Дедлайн</div>
</div>
<p class="hint">← левый край · середина = двигать · правый край → · красная точка = дедлайн</p>
</div>
</div>
<div class="tooltip" id="tip"></div>

<script>
var YEAR=2026, SM=5, MC=8, TD=MC*30;
var SK='gantt_2026_v1';
var MN=['Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
var WD=['вс','пн','вт','ср','чт','пт','сб'];
var MS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
var C={ko:'#534AB7',de:'#0F6E56',mi:'#185FA5',ar:'#993C1D',la:'#BA7517',da:'#E24B4A'};
var SC={'Костя':C.ko,'Денис':C.de,'Миша':C.mi,'Аркадий':C.ar,'Ключевые события':C.la};

// p(startMonth, startDay, endMonth, endDay) — months 1-based
function p(ms,ds,me,de){ return {leftDays:(ms-SM)*30+ds, widthDays:(me-SM)*30+de-((ms-SM)*30+ds)}; }
function dl(m,d){ return (m-SM)*30+d; }

function d2date(days){
  var d=new Date(YEAR,SM-1,1); d.setDate(d.getDate()+Math.round(days)); return d;
}
function d2lbl(days){
  var d=d2date(days);
  return d.getDate()+' '+MS[d.getMonth()]+' ('+WD[d.getDay()]+')';
}

// All tasks from 2025 plan, remapped to 2026 calendar
// Original plan: May2025=month5 → Jan2026=month1, keeping same relative months
// Костя: разделение сайта было май — перенесём как старые задачи в январь как референс + новые
var DEFS=[
  {title:'Костя', rows:[
    {id:'k1', name:'Разделение РФ/Казахстан', sub:'завершено, поддержка', bars:[{...p(5,1,6,15),color:C.ko}], dls:[dl(6,15)]},
  ]},
  {title:'Денис', rows:[
    {id:'d1', name:'Финстатистика', sub:'итоги 2025', bars:[{...p(5,1,5,20),color:C.de}], dls:[dl(5,20)]},
    {id:'d2', name:'Каз. бот КМЖ', sub:'тенге платежи', bars:[{...p(5,1,6,1),color:C.de}], dls:[dl(6,1)]},
    {id:'d3', name:'Пользовательская статистика', sub:'', bars:[{...p(5,15,6,28),color:C.de}], dls:[dl(6,28)]},
    {id:'d4', name:'Архитектура AI-бэка', sub:'Mini App КМЖ', bars:[{...p(6,1,7,15),color:C.de}], dls:[dl(7,15)]},
    {id:'d5', name:'Разработка бэка', sub:'Mini App КМЖ (AI)', bars:[{...p(7,15,8,15),color:C.de}], dls:[dl(8,15)]},
    {id:'d6', name:'Mini App x2x10', sub:'бэкенд (AI)', bars:[{...p(8,15,12,20),color:C.de}], dls:[dl(12,20)]},
    {id:'d7', name:'Инфра запуска x2x10', sub:'март и октябрь', bars:[{...p(6,15,7,15),color:C.de}], dls:[dl(7,15)]},
  ]},
  {title:'Миша', rows:[
    {id:'m1', name:'Лендинг-шедевр КМЖ', sub:'финальная доработка', bars:[{...p(5,1,6,15),color:C.mi}], dls:[dl(6,15)]},
    {id:'m2', name:'Интеграция фронт+бэк', sub:'Mini App КМЖ', bars:[{...p(7,15,8,15),color:C.mi}], dls:[dl(8,15)]},
    {id:'m3', name:'Mini App x2x10', sub:'фронтенд', bars:[{...p(8,15,12,20),color:C.mi}], dls:[dl(12,20)]},
  ]},
  {title:'Аркадий', rows:[
    {id:'a1', name:'Контент лендинга КМЖ', sub:'идея + тексты', bars:[{...p(5,1,6,1),color:C.ar}], dls:[dl(6,1)]},
    {id:'a2', name:'Рекл. волна 1', sub:'РФ трафик', bars:[{...p(6,15,6,28),color:C.ar}], dls:[dl(6,28)]},
    {id:'a3', name:'Рекл. волна 2', sub:'РФ трафик', bars:[{...p(7,15,7,30),color:C.ar}], dls:[dl(7,30)]},
    {id:'a4', name:'Рекл. волна 3', sub:'РФ трафик', bars:[{...p(8,15,8,30),color:C.ar}], dls:[dl(8,30)]},
    {id:'a5', name:'175 тыс/мес → маховик', sub:'цель выхода', bars:[{...p(9,1,9,10),color:C.da}], dls:[dl(9,1)]},
  ]},
  {title:'Ключевые события', rows:[
    {id:'e1', name:'Поток МЖ + КМЖ', sub:'1–3 января', bars:[{...p(5,1,5,3),color:C.la}], dls:[dl(5,3)]},
    {id:'e2', name:'Запуск x2x10 — весна', sub:'план 100 чел × 25 тыс', bars:[{...p(7,20,7,30),color:C.la}], dls:[dl(7,20)]},
    {id:'e3', name:'Mini App КМЖ обкатка', sub:'апрель', bars:[{...p(8,1,8,20),color:C.la}], dls:[dl(8,15)]},
    {id:'e4', name:'Ключи изобилия с Харой', sub:'ориентировочно осень', bars:[{...p(10,1,11,15),color:C.la}], dls:[dl(11,15)]},
    {id:'e5', name:'Запуск x2x10 — осень', sub:'план ≥ 100 чел', bars:[{...p(11,20,11,30),color:C.la}], dls:[dl(11,20)]},
  ]},
];

var state={}, customRows={};
function load(){ try{state=JSON.parse(localStorage.getItem(SK+'_s'))||{};}catch(e){state={};} try{customRows=JSON.parse(localStorage.getItem(SK+'_c'))||{};}catch(e){customRows={};} }
function ss(){ localStorage.setItem(SK+'_s',JSON.stringify(state)); }
function sc(){ localStorage.setItem(SK+'_c',JSON.stringify(customRows)); }
function resetAll(){ localStorage.removeItem(SK+'_s'); localStorage.removeItem(SK+'_c'); location.reload(); }
load();

var tip=document.getElementById('tip');
function show(x,y,t){ tip.style.display='block'; tip.style.left=(x+14)+'px'; tip.style.top=(y-38)+'px'; tip.textContent=t; }
function hide(){ tip.style.display='none'; }

// header
var mhEl=document.getElementById('mh');
MN.forEach(function(n){ var e=document.createElement('div'); e.className='month-label'; e.textContent=n; mhEl.appendChild(e); });
var dtlEl=document.getElementById('dtl');
[5,10,15,20,25,30].forEach(function(d){ for(var m=0;m<MC;m++){ var pos=((m*30+d)/TD*100).toFixed(2); var t=document.createElement('div'); t.className='date-tick'; t.style.left=pos+'%'; t.textContent=d; dtlEl.appendChild(t); }});

function makeBar(tl,bar,bk,dls,dp){
  var sv=state[bk], cl=sv?sv.left:bar.leftDays/TD*100, cw=sv?sv.width:bar.widthDays/TD*100, MW=0.4;
  var wrap=document.createElement('div'); wrap.className='bar-wrap'; wrap.style.left=cl.toFixed(2)+'%'; wrap.style.width=cw.toFixed(2)+'%';
  var body=document.createElement('div'); body.className='bar-body'; body.style.background=bar.color;
  var hL=document.createElement('div'); hL.className='handle handle-left';
  var hR=document.createElement('div'); hR.className='handle handle-right';
  wrap.appendChild(hL); wrap.appendChild(body); wrap.appendChild(hR); tl.appendChild(wrap);
  var dm=null,sx=0,sl=0,sw=0;
  function gx(e){return e.touches?e.touches[0].clientX:e.clientX;}
  function sd(e,m){dm=m;sx=gx(e);sl=cl;sw=cw;wrap.classList.add('dragging');if(e.preventDefault)e.preventDefault();}
  function mv(e){
    if(!dm)return; var r=tl.getBoundingClientRect(),pc=(gx(e)-sx)/r.width*100;
    if(dm==='move'){cl=Math.max(0,Math.min(100-sw,sl+pc));wrap.style.left=cl.toFixed(2)+'%';show(gx(e),r.top,d2lbl(cl/100*TD)+' → '+d2lbl((cl+cw)/100*TD));}
    else if(dm==='right'){cw=Math.max(MW,Math.min(100-sl,sw+pc));wrap.style.width=cw.toFixed(2)+'%';show(gx(e),r.top,'→ '+d2lbl((cl+cw)/100*TD));}
    else if(dm==='left'){var nl=Math.max(0,Math.min(sl+sw-MW,sl+pc));cw=sl+sw-nl;cl=nl;wrap.style.left=cl.toFixed(2)+'%';wrap.style.width=cw.toFixed(2)+'%';show(gx(e),r.top,d2lbl(cl/100*TD)+' →');}
  }
  function ed(){if(!dm)return;dm=null;wrap.classList.remove('dragging');hide();state[bk]={left:cl,width:cw};ss();}
  body.addEventListener('mousedown',function(e){sd(e,'move');});
  hL.addEventListener('mousedown',function(e){sd(e,'left');e.stopPropagation();});
  hR.addEventListener('mousedown',function(e){sd(e,'right');e.stopPropagation();});
  body.addEventListener('touchstart',function(e){sd(e,'move');},{passive:false});
  hL.addEventListener('touchstart',function(e){sd(e,'left');e.stopPropagation();},{passive:false});
  hR.addEventListener('touchstart',function(e){sd(e,'right');e.stopPropagation();},{passive:false});
  document.addEventListener('mousemove',mv); document.addEventListener('mouseup',ed);
  document.addEventListener('touchmove',function(e){if(dm)mv(e);},{passive:true}); document.addEventListener('touchend',ed);

  dls.forEach(function(dd,di){
    var dk=dp+'_dl'+di, cd=(state[dk]!==undefined)?state[dk]:dd;
    var de=document.createElement('div'); de.className='deadline'; de.style.left=(cd/TD*100).toFixed(2)+'%'; tl.appendChild(de);
    var dg=false,dsx=0,dsd=0;
    function dgx(e){return e.touches?e.touches[0].clientX:e.clientX;}
    de.addEventListener('mousedown',function(e){dg=true;dsx=dgx(e);dsd=cd;de.classList.add('dragging');e.stopPropagation();e.preventDefault();});
    de.addEventListener('touchstart',function(e){dg=true;dsx=dgx(e);dsd=cd;de.classList.add('dragging');e.stopPropagation();},{passive:false});
    document.addEventListener('mousemove',function(e){if(!dg)return;var r=tl.getBoundingClientRect();cd=Math.max(0,Math.min(TD,dsd+(dgx(e)-dsx)/r.width*TD));de.style.left=(cd/TD*100).toFixed(2)+'%';show(dgx(e),r.top,'⏱ '+d2lbl(cd));});
    document.addEventListener('touchmove',function(e){if(!dg)return;var r=tl.getBoundingClientRect();cd=Math.max(0,Math.min(TD,dsd+(dgx(e)-dsx)/r.width*TD));de.style.left=(cd/TD*100).toFixed(2)+'%';},{passive:true});
    function dend(){if(!dg)return;dg=false;de.classList.remove('dragging');hide();state[dk]=cd;ss();}
    document.addEventListener('mouseup',dend); document.addEventListener('touchend',dend);
  });
}

function renderRow(row, secTitle, container, addBtnRef){
  var rowEl=document.createElement('div'); rowEl.className='row';
  var nw=document.createElement('div'); nw.className='task-name';

  // --- view mode ---
  var viewWrap=document.createElement('div'); viewWrap.className='task-name-text'; viewWrap.style.cursor='pointer'; viewWrap.title='Нажми чтобы редактировать';
  function refreshView(){ viewWrap.innerHTML=row.name+(row.sub?'<span class="sub">'+row.sub+'</span>':''); }
  refreshView();

  // --- edit mode ---
  var editWrap=document.createElement('div'); editWrap.style.cssText='display:none;flex-direction:column;gap:3px;flex:1;min-width:0;';
  var inp1=document.createElement('input'); inp1.type='text'; inp1.style.cssText='font-size:12px;border:1px solid #aaa;border-radius:4px;padding:2px 5px;width:100%;outline:none;';
  var inp2=document.createElement('input'); inp2.type='text'; inp2.placeholder='подзаголовок'; inp2.style.cssText='font-size:11px;border:1px solid #ddd;border-radius:4px;padding:2px 5px;width:100%;outline:none;color:#888;';
  editWrap.appendChild(inp1); editWrap.appendChild(inp2);

  function openEdit(){
    viewWrap.style.display='none'; editWrap.style.display='flex';
    inp1.value=row.name; inp2.value=row.sub||''; inp1.focus(); inp1.select();
  }
  function closeEdit(){
    var newName=inp1.value.trim(), newSub=inp2.value.trim();
    if(newName){ row.name=newName; row.sub=newSub; }
    // persist if custom row
    if(customRows[secTitle]){
      customRows[secTitle]=customRows[secTitle].map(function(r){ return r.id===row.id?row:r; });
      sc();
    } else {
      // persist edits for built-in rows via state
      state['name_'+row.id]=row.name; state['sub_'+row.id]=row.sub; ss();
    }
    refreshView();
    editWrap.style.display='none'; viewWrap.style.display='';
  }
  viewWrap.addEventListener('click', openEdit);
  inp1.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();closeEdit();} if(e.key==='Escape'){editWrap.style.display='none';viewWrap.style.display='';} });
  inp2.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();closeEdit();} if(e.key==='Escape'){editWrap.style.display='none';viewWrap.style.display='';} });
  function onDocMousedown(e){
    if(editWrap.style.display!=='none' && !editWrap.contains(e.target)){
      closeEdit();
    }
  }
  document.addEventListener('mousedown', onDocMousedown);

  // restore saved edits for built-in rows
  if(state['name_'+row.id]){ row.name=state['name_'+row.id]; row.sub=state['sub_'+row.id]||''; refreshView(); }

  var db=document.createElement('button'); db.className='delete-btn'; db.textContent='✕'; db.title='Удалить';
  db.onclick=function(){
    if(!customRows[secTitle])return;
    customRows[secTitle]=customRows[secTitle].filter(function(r){return r.id!==row.id;});
    sc(); rowEl.remove();
  };

  nw.appendChild(viewWrap); nw.appendChild(editWrap); nw.appendChild(db);
  if(addBtnRef){ nw.appendChild(addBtnRef); }

  var tl=document.createElement('div'); tl.className='tl';
  var gl=document.createElement('div'); gl.className='grid-lines';
  for(var i=0;i<MC;i++){var g=document.createElement('div');g.className='grid-line';gl.appendChild(g);}
  tl.appendChild(gl);
  row.bars.forEach(function(bar,bi){ makeBar(tl,bar,row.id+'_b'+bi,row.dls,row.id); });
  rowEl.appendChild(nw); rowEl.appendChild(tl);
  container.appendChild(rowEl);
  return rowEl;
}

var cb=document.getElementById('cb');

// Section order persistence
var secOrder = [];
try { secOrder = JSON.parse(localStorage.getItem(SK+'_order'))||[]; } catch(e){ secOrder=[]; }
if(secOrder.length !== DEFS.length) secOrder = DEFS.map(function(s){ return s.title; });
var DEFS_ORDERED = secOrder.map(function(t){ return DEFS.find(function(d){ return d.title===t; }); }).filter(Boolean);
// add any missing
DEFS.forEach(function(d){ if(!DEFS_ORDERED.find(function(x){ return x&&x.title===d.title; })) DEFS_ORDERED.push(d); });

function saveSectionOrder(){
  var blocks = cb.querySelectorAll('.section-block');
  var order = Array.from(blocks).map(function(b){ return b.getAttribute('data-sec'); });
  localStorage.setItem(SK+'_order', JSON.stringify(order));
}

var dragSrc = null;

DEFS_ORDERED.forEach(function(sec){
  if(!sec) return;
  var color=SC[sec.title]||C.la;

  var block = document.createElement('div');
  block.className = 'section-block';
  block.setAttribute('data-sec', sec.title);
  block.draggable = true;

  var secEl=document.createElement('div'); secEl.className='section-label';
  var handle = document.createElement('span'); handle.className='sec-drag-handle'; handle.textContent='⠿'; handle.title='Перетащи чтобы переместить секцию';
  secEl.appendChild(handle);
  var titleEl = document.createElement('div'); titleEl.className='name-col'; titleEl.textContent=sec.title;
  secEl.appendChild(titleEl);
  secEl.appendChild(document.createElement('div')).style.flex='1';
  block.appendChild(secEl);
  cb.appendChild(block);

  block.addEventListener('dragstart', function(e){
    dragSrc = block;
    block.classList.add('dragging-sec');
    e.dataTransfer.effectAllowed = 'move';
  });
  block.addEventListener('dragend', function(){
    block.classList.remove('dragging-sec');
    cb.querySelectorAll('.section-block').forEach(function(b){ b.classList.remove('drag-over-sec'); });
    saveSectionOrder();
  });
  block.addEventListener('dragover', function(e){
    e.preventDefault();
    if(dragSrc && dragSrc !== block){
      cb.querySelectorAll('.section-block').forEach(function(b){ b.classList.remove('drag-over-sec'); });
      block.classList.add('drag-over-sec');
    }
  });
  block.addEventListener('drop', function(e){
    e.preventDefault();
    if(dragSrc && dragSrc !== block){
      var blocks = Array.from(cb.querySelectorAll('.section-block'));
      var fromIdx = blocks.indexOf(dragSrc);
      var toIdx = blocks.indexOf(block);
      if(fromIdx < toIdx) cb.insertBefore(dragSrc, block.nextSibling);
      else cb.insertBefore(dragSrc, block);
      block.classList.remove('drag-over-sec');
    }
  });

  var secCon=document.createElement('div');
  block.appendChild(secCon);

  // form (hidden until + clicked)
  var form=document.createElement('div'); form.className='add-form';
  form.innerHTML='<input class="inp-name" type="text" placeholder="Название задачи" /><input class="inp-sub" type="text" placeholder="Подзаголовок (необязательно)" /><div class="add-form-btns"><button class="btn-ok">Добавить</button><button class="btn-cancel">Отмена</button></div>';

  // + button
  var addBtn=document.createElement('button'); addBtn.className='add-btn-inline'; addBtn.textContent='+'; addBtn.title='Добавить задачу';
  addBtn.onclick=function(e){ e.stopPropagation(); form.classList.toggle('open'); if(form.classList.contains('open')) form.querySelector('.inp-name').focus(); };

  function doAdd(){
    var nv=form.querySelector('.inp-name').value.trim();
    if(!nv)return;
    var sv=form.querySelector('.inp-sub').value.trim();
    var uid=sec.title.slice(0,2)+Date.now();
    var nr={id:uid,name:nv,sub:sv,bars:[{leftDays:0,widthDays:30,color:color}],dls:[0]};
    if(!customRows[sec.title])customRows[sec.title]=[];
    customRows[sec.title].push(nr);
    sc();
    // move + btn to new last row
    addBtn.remove();
    // render new row with + btn
    renderRow(nr, sec.title, secCon, addBtn);
    form.querySelector('.inp-name').value='';
    form.querySelector('.inp-sub').value='';
    form.classList.remove('open');
  }

  form.querySelector('.btn-ok').onclick=doAdd;
  form.querySelector('.btn-cancel').onclick=function(){form.classList.remove('open');};
  form.querySelector('.inp-name').addEventListener('keydown',function(e){if(e.key==='Enter')doAdd();if(e.key==='Escape')form.classList.remove('open');});
  secCon.appendChild(form);

  // gather all rows for this section
  var allRows=sec.rows.slice();
  if(customRows[sec.title]) allRows=allRows.concat(customRows[sec.title]);

  allRows.forEach(function(row,i){
    var isLast=(i===allRows.length-1);
    renderRow(row, sec.title, secCon, isLast?addBtn:null);
  });

  // if no rows at all, add a placeholder row with the + btn
  if(allRows.length===0){
    var placeholder=document.createElement('div'); placeholder.className='row';
    var nw=document.createElement('div'); nw.className='task-name';
    nw.appendChild(addBtn);
    placeholder.appendChild(nw);
    var tl=document.createElement('div'); tl.className='tl';
    placeholder.appendChild(tl);
    secCon.appendChild(placeholder);
  }
});

function exportChart(){
  var h=document.documentElement.outerHTML;
  h=h.replace('var state={}, customRows={};','var state='+JSON.stringify(state)+', customRows='+JSON.stringify(customRows)+';');
  h=h.replace('load();','');
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));
  a.download='Gantt_команда_'+new Date().toISOString().slice(0,10)+'.html'; a.click();
}
</script>
</body>
</html>
